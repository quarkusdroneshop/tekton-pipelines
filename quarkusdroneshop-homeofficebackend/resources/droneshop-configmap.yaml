apiVersion: v1
kind: ConfigMap
metadata:
  name: droneshop-config
  namespace: quarkusdroneshop-demo
data:
  KAFKA_BOOTSTRAP_URLS: "shop-cluster-kafka-bootstrap:9092"
  STREAM_URL: "http://localhost:8080/dashboard/stream"
  LOYALTY_STREAM_URL: "http://localhost:8080/dashboard/loyaltystream"
  CORS_ORIGINS: "http://localhost:8080"
  STORE_ID: "TOKYO"
  PGSQL_URL: "jdbc:postgresql://droneshopdb-ha:5432/droneshopdb?currentSchema=droneshop"
  QUARKUS_LOG_LEVEL: "INFO"
  QUARKUSDRONESHOP_LOG_LEVEL: "INFO"
  JAVA_OPTS_APPEND: "-Dquarkus.profile=prod"
  # 以下はSandboxごとに実際のURLへ手動で書き換えること (deploy-pipeline.yaml の
  # push-oc-apps がここから読み取り homeoffice-backend の Deployment env に反映する)。
  # INVENTORY_API_URL: "https://inventory-quarkusdroneshop-demo.apps.ocp.<bsite-domain>"
  # ASITE_APICURIO_REGISTRY_URL: "http://droneshop-apicurioregistry-kafkasql.quarkusdroneshop-demo.router-default.apps.ocp.<asite-domain>"